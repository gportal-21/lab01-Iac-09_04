name: Saludando

on:
  push:
    branches:
      - main
      - develop

env:
  nombre: Gerson Portal

jobs:
  saludo:
    runs-on: ubuntu-latest
    steps:
      - name: Saludo desde main
        if: github.ref == 'refs/heads/main'
        run: echo "Hola desde el main, mi nombre es ${{ env.nombre }}"
      - name: Saludo desde develop
        if: github.ref == 'refs/heads/develop'
        run: echo "Hola desde develop, mi nombre es ${{ env.nombre }}"
